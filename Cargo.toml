[package]
name = "xe"
version = "0.2.0"
edition = "2021"
authors = ["Vaibhav Pratap Singh <v8v88v8v88@protonmail.com>"]
description = "XE Programming Language"
license = "GPL-3.0-or-later"

[dependencies]
self_update = { version = "1.3.3", default-features = false, features = ["github", "reqwest", "rustls", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }

[[test]]
name = "integration"
path = "tests/unit/basic_test.rs"

[[test]]
name = "type_system"
path = "tests/unit/type_system_test.rs"
