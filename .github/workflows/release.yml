name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: xe-x86_64-unknown-linux-gnu.tar.gz
            binary_name: xe
            archive_kind: tar
          - runner: macos-13
            target: x86_64-apple-darwin
            asset_name: xe-x86_64-apple-darwin.tar.gz
            binary_name: xe
            archive_kind: tar
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_name: xe-aarch64-apple-darwin.tar.gz
            binary_name: xe
            archive_kind: tar
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: xe-x86_64-pc-windows-msvc.zip
            binary_name: xe.exe
            archive_kind: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (tar)
        if: matrix.archive_kind == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/xe
          tar -C dist -czf "dist/${{ matrix.asset_name }}" xe
          rm dist/xe

      - name: Package archive (zip)
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/xe.exe"
          Compress-Archive -Path "dist/xe.exe" -DestinationPath "dist/${{ matrix.asset_name }}" -Force
          Remove-Item "dist/xe.exe"

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
