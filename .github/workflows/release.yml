name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: xe-x86_64-unknown-linux-gnu.tar.gz
            binary_name: xe
            archive_kind: tar
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset_name: xe-x86_64-apple-darwin.tar.gz
            binary_name: xe
            archive_kind: tar
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_name: xe-aarch64-apple-darwin.tar.gz
            binary_name: xe
            archive_kind: tar
          - runner: windows-latest
            target: x86_64-pc-windows-gnu
            asset_name: xe-x86_64-pc-windows-gnu.zip
            binary_name: xe.exe
            archive_kind: zip
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: xe-x86_64-pc-windows-msvc.zip
            binary_name: xe.exe
            archive_kind: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify Cargo.toml version matches release tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)
          echo "Release Tag Version: $TAG_VERSION"
          echo "Cargo.toml Version:  $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)! Aborting build."
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (tar)
        if: matrix.archive_kind == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/xe
          tar -C dist -czf "dist/${{ matrix.asset_name }}" xe
          rm dist/xe

      - name: Package archive (zip)
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/xe.exe"
          Compress-Archive -Path "dist/xe.exe" -DestinationPath "dist/${{ matrix.asset_name }}" -Force
          Remove-Item "dist/xe.exe"

      - name: Upload packaged asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*
